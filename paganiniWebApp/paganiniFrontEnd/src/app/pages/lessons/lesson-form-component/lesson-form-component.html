<div class="min-h-screen bg-stone-50 p-8 flex items-center justify-center">
  <div class="w-full max-w-2xl bg-white border border-stone-200 rounded-2xl shadow-sm p-10">

    <div class="mb-10">
      <h1 class="text-3xl font-black tracking-tight text-stone-800">
        Lección<span class="text-orange-600">.</span>
      </h1>

      <p class="text-sm text-stone-500 mt-1">Crear o editar lección</p>
    </div>

    <div class="space-y-8">

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">
          Título
        </label>

        <input
          type="text"
          name="title"
          required
          #title="ngModel"
          [(ngModel)]="lesson.title"
          class="w-full border-b border-stone-300 bg-transparent px-1 py-3 text-stone-800 focus:outline-none focus:border-orange-600 transition"
          placeholder="Ejemplo: Introducción a escalas"
        />

        <span
          *ngIf="title.invalid && title.touched"
          class="text-xs text-red-500 mt-2 block">
          Campo requerido
        </span>
      </div>

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">
          Fecha de lección
        </label>

        <input
          type="date"
          name="lessonDate"
          required
          #lessonDate="ngModel"
          [(ngModel)]="lesson.lessonDate"
          class="w-full border-b border-stone-300 bg-transparent px-1 py-3 text-stone-800 focus:outline-none focus:border-orange-600 transition"
        />

        <span
          *ngIf="lessonDate.invalid && lessonDate.touched"
          class="text-xs text-red-500 mt-2 block">
          Campo requerido
        </span>
      </div>

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">
          Curso
        </label>

        <select
          name="course"
          required
          #course="ngModel"
          [(ngModel)]="courseId"
          class="w-full border-b border-stone-300 bg-transparent px-1 py-3 text-stone-800 focus:outline-none focus:border-orange-600 transition">

          <option [ngValue]="null">
            Selecciona un curso
          </option>

          <option *ngFor="let course of courses" [ngValue]="course.id">
            {{ course.name }}
          </option>

        </select>

        <span
          *ngIf="course.invalid && course.touched"
          class="text-xs text-red-500 mt-2 block">
          Campo requerido
        </span>
      </div>

      <div class="flex items-center gap-3">
        <input
          type="checkbox"
          [(ngModel)]="lesson.visible"
          class="w-4 h-4 accent-orange-600"
        />

        <label class="text-sm text-stone-700">
          Lección visible para alumnos
        </label>
      </div>

      <div class="flex justify-end gap-4 pt-6">
        <button
          (click)="cancel()"
          class="px-5 py-3 rounded-lg border border-stone-300 text-stone-700 hover:bg-stone-100 transition">
          Cancelar
        </button>

        <button
          (click)="saveLesson()"
          class="px-5 py-3 rounded-lg bg-orange-600 hover:bg-orange-500 text-white transition flex items-center gap-2">
          <i class="bi bi-floppy"></i>
          Guardar
        </button>
      </div>

    </div>
  </div>
</div>
