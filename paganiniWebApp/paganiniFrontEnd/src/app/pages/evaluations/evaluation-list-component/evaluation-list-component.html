<div class="min-h-screen bg-stone-50 p-8">

  <div class="flex items-center justify-between mb-10">
    <div>
      <h1 class="text-3xl font-black tracking-tight text-stone-800">
        Evaluaciones<span class="text-orange-600">.</span>
      </h1>
      <p class="text-sm text-stone-500 mt-1">Gestión de evaluaciones académicas</p>
    </div>

    <button
      (click)="goToNewEvaluation()"
      class="bg-orange-600 hover:bg-orange-500 text-white px-5 py-3 rounded-lg text-sm font-medium transition flex items-center gap-2">
      <i class="bi bi-plus-lg"></i>
      Nueva Evaluación
    </button>
  </div>

  <div class="bg-white border border-stone-200 rounded-2xl shadow-sm overflow-hidden">

    <div class="grid grid-cols-5 px-6 py-4 border-b border-stone-200 bg-stone-50 text-xs font-semibold uppercase tracking-wide text-stone-500">
      <div>Título</div>
      <div>Puntaje máximo</div>
      <div>Fecha</div>
      <div>Lección</div>
      <div class="text-right">Acciones</div>
    </div>

    <div
      *ngFor="let evaluation of evaluations"
      class="grid grid-cols-5 px-6 py-5 border-b border-stone-100 items-center hover:bg-stone-50 transition">

      <div class="font-medium text-stone-800">{{ evaluation.title }}</div>
      <div class="text-sm text-stone-600">{{ evaluation.maxScore }}</div>
      <div class="text-sm text-stone-600">{{ evaluation.evaluationDate }}</div>
      <div class="text-sm text-stone-600">{{ evaluation.lesson?.title }}</div>

      <div class="flex justify-end gap-3">
        <button (click)="goToDetail(evaluation.id!)" class="w-9 h-9 rounded-lg border border-stone-200 hover:bg-stone-100 transition flex items-center justify-center text-stone-600">
          <i class="bi bi-eye"></i>
        </button>

        <button (click)="goToEdit(evaluation.id!)" class="w-9 h-9 rounded-lg border border-stone-200 hover:bg-orange-50 hover:border-orange-200 transition flex items-center justify-center text-orange-600">
          <i class="bi bi-pencil"></i>
        </button>

        <button (click)="deleteEvaluation(evaluation.id!)" class="w-9 h-9 rounded-lg border border-stone-200 hover:bg-red-50 hover:border-red-200 transition flex items-center justify-center text-red-600">
          <i class="bi bi-trash"></i>
        </button>
      </div>

    </div>

  </div>
</div>
