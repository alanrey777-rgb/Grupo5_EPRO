<div class="min-h-screen bg-stone-50 p-8 flex items-center justify-center">
  <div class="w-full max-w-2xl bg-white border border-stone-200 rounded-2xl shadow-sm p-10">

    <div class="mb-10">
      <h1 class="text-3xl font-black tracking-tight text-stone-800">
        Alumno<span class="text-orange-600">.</span>
      </h1>

      <p class="text-sm text-stone-500 mt-1">Crear o editar alumno</p>
    </div>

    <div class="space-y-8">

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">
          Usuario
        </label>

        <select
          [(ngModel)]="userId"
          class="w-full border-b border-stone-300 bg-transparent px-1 py-3 text-stone-800 focus:outline-none focus:border-orange-600 transition">
          <option [ngValue]="null">Selecciona un usuario</option>

          <option *ngFor="let user of users" [ngValue]="user.id">
            {{ user.fullName }}
          </option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">
          Encargado
        </label>

        <select
          [(ngModel)]="parentId"
          class="w-full border-b border-stone-300 bg-transparent px-1 py-3 text-stone-800 focus:outline-none focus:border-orange-600 transition">
          <option [ngValue]="null">Selecciona un encargado</option>

          <option *ngFor="let parent of parents" [ngValue]="parent.id">
            {{ parent.user.fullName }}
          </option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">
          Fecha de nacimiento
        </label>

        <input
          type="date"
          [(ngModel)]="student.birthDate"
          class="w-full border-b border-stone-300 bg-transparent px-1 py-3 text-stone-800 focus:outline-none focus:border-orange-600 transition"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">
          Teléfono
        </label>

        <input
          type="text"
          [(ngModel)]="student.phone"
          class="w-full border-b border-stone-300 bg-transparent px-1 py-3 text-stone-800 focus:outline-none focus:border-orange-600 transition"
          placeholder="Ejemplo: 7777-8888"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">
          Estado académico
        </label>

        <select
          [(ngModel)]="student.academicStatus"
          class="w-full border-b border-stone-300 bg-transparent px-1 py-3 text-stone-800 focus:outline-none focus:border-orange-600 transition">
          <option value="">Selecciona un estado</option>
          <option value="ACTIVO">Activo</option>
          <option value="INACTIVO">Inactivo</option>
          <option value="GRADUADO">Graduado</option>
        </select>
      </div>

      <div class="flex justify-end gap-4 pt-6">
        <button
          class="px-5 py-3 rounded-lg border border-stone-300 text-stone-700 hover:bg-stone-100 transition"
          (click)="cancel()">
          Cancelar
        </button>

        <button
          class="px-5 py-3 rounded-lg bg-orange-600 hover:bg-orange-500 text-white transition flex items-center gap-2"
          (click)="saveStudent()">
          <i class="bi bi-floppy"></i>
          Guardar
        </button>
      </div>

    </div>
  </div>
</div>
