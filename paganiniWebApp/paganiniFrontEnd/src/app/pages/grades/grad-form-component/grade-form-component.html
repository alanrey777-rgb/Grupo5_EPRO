<div class="min-h-screen bg-stone-50 p-8 flex items-center justify-center">
  <div class="w-full max-w-2xl bg-white border border-stone-200 rounded-2xl shadow-sm p-10">

    <div class="mb-10">
      <h1 class="text-3xl font-black tracking-tight text-stone-800">
        Calificación<span class="text-orange-600">.</span>
      </h1>
      <p class="text-sm text-stone-500 mt-1">Registrar nota de estudiante</p>
    </div>

    <div class="space-y-8">

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">Alumno</label>
        <select name="student" required #student="ngModel" [(ngModel)]="studentId"
          class="w-full border-b border-stone-300 bg-transparent px-1 py-3 text-stone-800 focus:outline-none focus:border-orange-600 transition">
          <option [ngValue]="null">Selecciona un alumno</option>
          <option *ngFor="let student of students" [ngValue]="student.id">
            {{ student.user?.fullName }}
          </option>
        </select>
        <span *ngIf="student.invalid && student.touched" class="text-xs text-red-500 mt-2 block">Campo requerido</span>
      </div>

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">Evaluación</label>
        <select name="evaluation" required #evaluation="ngModel" [(ngModel)]="evaluationId"
          class="w-full border-b border-stone-300 bg-transparent px-1 py-3 text-stone-800 focus:outline-none focus:border-orange-600 transition">
          <option [ngValue]="null">Selecciona una evaluación</option>
          <option *ngFor="let evaluation of evaluations" [ngValue]="evaluation.id">
            {{ evaluation.title }}
          </option>
        </select>
        <span *ngIf="evaluation.invalid && evaluation.touched" class="text-xs text-red-500 mt-2 block">Campo requerido</span>
      </div>

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">Entrega</label>
        <select name="submission" required #submissionSelect="ngModel" [(ngModel)]="submissionId"
          class="w-full border-b border-stone-300 bg-transparent px-1 py-3 text-stone-800 focus:outline-none focus:border-orange-600 transition">
          <option [ngValue]="null">Selecciona una entrega</option>
          <option *ngFor="let submission of submissions" [ngValue]="submission.id">
            {{ submission.title }}
          </option>
        </select>
        <span *ngIf="submissionSelect.invalid && submissionSelect.touched" class="text-xs text-red-500 mt-2 block">Campo requerido</span>
      </div>

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">Nota</label>
        <input type="number" name="score" required #score="ngModel" [(ngModel)]="grade.score"
          class="w-full border-b border-stone-300 bg-transparent px-1 py-3 text-stone-800 focus:outline-none focus:border-orange-600 transition"
          placeholder="Ejemplo: 8.5" />
        <span *ngIf="score.invalid && score.touched" class="text-xs text-red-500 mt-2 block">Campo requerido</span>
      </div>

      <div>
        <label class="block text-sm font-medium text-stone-700 mb-2">Comentarios</label>
        <textarea name="comments" [(ngModel)]="grade.comments"
          class="w-full border-b border-stone-300 bg-transparent px-1 py-3 text-stone-800 focus:outline-none focus:border-orange-600 transition"
          placeholder="Comentarios del docente"></textarea>
      </div>

      <div class="flex justify-end gap-4 pt-6">
        <button (click)="cancel()" class="px-5 py-3 rounded-lg border border-stone-300 text-stone-700 hover:bg-stone-100 transition">
          Cancelar
        </button>

        <button (click)="saveGrade()" class="px-5 py-3 rounded-lg bg-orange-600 hover:bg-orange-500 text-white transition flex items-center gap-2">
          <i class="bi bi-floppy"></i>
          Guardar
        </button>
      </div>

    </div>
  </div>
</div>
