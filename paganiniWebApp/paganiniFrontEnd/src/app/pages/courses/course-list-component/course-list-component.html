<div class="min-h-screen bg-stone-50 p-8">

  <div class="flex items-center justify-between mb-10">

    <div>
      <h1 class="text-3xl font-black tracking-tight text-stone-800">
        Cursos<span class="text-orange-600">.</span>
      </h1>

      <p class="text-sm text-stone-500 mt-1">
        Gestión de cursos y lecciones musicales
      </p>
    </div>

    <button
      (click)="goToNewCourse()"
      class="bg-orange-600 hover:bg-orange-500 text-white px-5 py-3 rounded-lg text-sm font-medium transition flex items-center gap-2">

      <i class="bi bi-plus-lg"></i>
      Nuevo Curso
    </button>

  </div>

  <div class="bg-white border border-stone-200 rounded-2xl shadow-sm overflow-hidden">

    <div class="grid grid-cols-5 px-6 py-4 border-b border-stone-200 bg-stone-50 text-xs font-semibold uppercase tracking-wide text-stone-500">
      <div>Nombre</div>
      <div>Nivel</div>
      <div>Docente</div>
      <div>Estado</div>
      <div class="text-right">Acciones</div>
    </div>

    <div
      *ngFor="let course of courses"
      class="grid grid-cols-5 px-6 py-5 border-b border-stone-100 items-center hover:bg-stone-50 transition">

      <div class="font-medium text-stone-800">
        {{ course.name }}
      </div>

      <div class="text-sm text-stone-600">
        {{ course.level }}
      </div>

      <div class="text-sm text-stone-600">
        {{ course.teacher.user.fullName }}
      </div>

      <div>
        <span
          class="text-xs px-3 py-1 rounded-full"
          [ngClass]="course.active
            ? 'bg-green-100 text-green-700'
            : 'bg-red-100 text-red-700'">

          {{ course.active ? 'Activo' : 'Inactivo' }}
        </span>
      </div>

      <div class="flex justify-end gap-3">

        <button
          (click)="goToDetail(course.id!)"
          class="w-9 h-9 rounded-lg border border-stone-200 hover:bg-stone-100 transition flex items-center justify-center text-stone-600">

          <i class="bi bi-eye"></i>
        </button>

        <button
          (click)="goToEdit(course.id!)"
          class="w-9 h-9 rounded-lg border border-stone-200 hover:bg-orange-50 hover:border-orange-200 transition flex items-center justify-center text-orange-600">

          <i class="bi bi-pencil"></i>
        </button>

        <button
          (click)="deleteCourse(course.id!)"
          class="w-9 h-9 rounded-lg border border-stone-200 hover:bg-red-50 hover:border-red-200 transition flex items-center justify-center text-red-600">

          <i class="bi bi-trash"></i>
        </button>

      </div>

    </div>

  </div>

</div>
