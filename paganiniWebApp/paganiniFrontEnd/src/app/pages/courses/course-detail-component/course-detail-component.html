<div class="min-h-screen bg-stone-50 p-8 flex items-center justify-center">

  <div class="w-full max-w-2xl bg-white border border-stone-200 rounded-2xl shadow-sm p-10">

    <!-- Header -->
    <div class="mb-10 flex items-center justify-between">

      <div>

        <h1 class="text-3xl font-black tracking-tight text-stone-800">
          Detalle del Curso<span class="text-orange-600">.</span>
        </h1>

        <p class="text-sm text-stone-500 mt-1">
          Información completa del curso
        </p>

      </div>

      <div
        class="w-14 h-14 rounded-2xl bg-orange-100 text-orange-600 flex items-center justify-center text-2xl">

        <i class="bi bi-music-note-beamed"></i>

      </div>

    </div>

    <!-- Información -->
    <div class="space-y-8">

      <div>
        <p class="text-xs uppercase tracking-wide text-stone-400 mb-2">
          Nombre
        </p>

        <p class="text-lg font-semibold text-stone-800">
          {{ course.name }}
        </p>
      </div>

      <div>
        <p class="text-xs uppercase tracking-wide text-stone-400 mb-2">
          Nivel
        </p>

        <p class="text-lg font-semibold text-stone-800">
          {{ course.level }}
        </p>
      </div>

      <div>
        <p class="text-xs uppercase tracking-wide text-stone-400 mb-2">
          Estado
        </p>

        <span
          class="text-sm px-4 py-2 rounded-full"
          [ngClass]="course.active
            ? 'bg-green-100 text-green-700'
            : 'bg-red-100 text-red-700'">

          {{ course.active ? 'Activo' : 'Inactivo' }}
        </span>
      </div>

      <div>
        <p class="text-xs uppercase tracking-wide text-stone-400 mb-2">
          Docente
        </p>

        <p class="text-lg font-semibold text-stone-800">
          {{ course.teacher.user.fullName }}
        </p>
      </div>

    </div>

  </div>

</div>
